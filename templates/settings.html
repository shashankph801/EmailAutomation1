<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume Agent - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0d0d;--surface:#151515;--surface2:#1c1c1c;--border:#2a2a2a;--accent:#e8ff47;--text:#f0f0f0;--muted:#888;--error:#f87171;--success:#4ade80;--radius:8px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;padding:2rem 1rem 4rem}
    .wrap{width:100%;max-width:980px;margin:0 auto}
    header{margin-bottom:24px}
    .badge{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:8px}
    h1{font-size:2rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
    h2{font-size:1.1rem;margin-bottom:12px}
    label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 5px}
    input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:9px 11px;outline:none}
    textarea{min-height:86px;resize:vertical;line-height:1.5}
    input:focus,textarea:focus{border-color:var(--accent)}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:var(--accent);color:#000;font-weight:700;padding:10px 14px;margin-top:12px;cursor:pointer;text-decoration:none}
    .ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .danger{background:transparent;color:var(--error);border:1px solid rgba(248,113,113,.45);padding:7px 10px;margin:0}
    .item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--border);padding:12px 0}
    .item:first-child{border-top:0}
    .title{font-weight:700}
    .meta{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-top:3px;word-break:break-all}
    .status{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:10px;color:var(--muted)}
    .status.ok{color:var(--success)}
    .status.err{color:var(--error)}
    .actions{display:flex;gap:10px;margin-top:18px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a href="/logout" style="position:fixed;top:1rem;right:1rem;z-index:999;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:5px 14px;border-radius:20px;transition:color .15s,border-color .15s" onmouseover="this.style.color='#f87171';this.style.borderColor='rgba(248,113,113,.45)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">Logout</a>
  <div class="wrap">
    <header>
      <div class="badge">Resume Agent - Settings</div>
      <h1>Manage roles and interview panels</h1>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>Roles</h2>
        <div id="rolesList"></div>

        <label for="roleName">Role name</label>
        <input id="roleName" placeholder="Business Analyst" autocomplete="off" />

        <label for="roleLink">JD / assignment link</label>
        <input id="roleLink" placeholder="https://drive.google.com/..." autocomplete="off" />

        <label for="emailSubject">Email subject</label>
        <input id="emailSubject" placeholder="Internship Opportunity - Case Study Submission" autocomplete="off" />

        <label for="emailBody">Email body</label>
        <textarea id="emailBody" placeholder="Email text sent to candidates" autocomplete="off"></textarea>

        <label for="inviteSubject">Interview invite subject</label>
        <input id="inviteSubject" placeholder="Invitation: Business Analyst Interview" autocomplete="off" />

        <label for="inviteBody">Interview invite body</label>
        <textarea id="inviteBody" placeholder="Interview invite text" autocomplete="off"></textarea>

        <button class="btn" id="addRoleBtn">Add Role</button>
        <div class="status" id="roleStatus"></div>
      </section>

      <section class="panel">
        <h2>Interview Panels</h2>
        <div id="panelsList"></div>

        <label for="panelName">Panel name</label>
        <input id="panelName" placeholder="Shashank" autocomplete="off" />

        <label for="panelEmail">Panel email</label>
        <input id="panelEmail" type="email" placeholder="person@example.com" autocomplete="off" />

        <button class="btn" id="addPanelBtn">Add Panel</button>
        <div class="status" id="panelStatus"></div>
      </section>
    </div>

    <div class="actions">
      <a class="btn ghost" href="/main">Back to Main</a>
      <a class="btn ghost" href="/interview">Open Interview</a>
      <a class="btn ghost" href="/app">Open JD Email</a>
    </div>
  </div>

  <script>
    let settings = {roles: [], panels: []};

    function text(value){ return value || ''; }

    function setStatus(id, msg, cls){
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'status ' + (cls || '');
    }

    async function loadSettings(){
      const res = await fetch('/api/settings');
      settings = await res.json();
      renderRoles();
      renderPanels();
    }

    function renderRoles(){
      const list = document.getElementById('rolesList');
      if(!settings.roles.length){
        list.innerHTML = '<div class="meta">No roles yet.</div>';
        return;
      }
      list.innerHTML = '';
      settings.roles.forEach(role => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div>
            <div class="title"></div>
            <div class="meta"></div>
          </div>
          <button class="btn danger" data-id="${role.id}">Delete</button>
        `;
        row.querySelector('.title').textContent = role.name;
        row.querySelector('.meta').textContent = role.upload_link || 'No JD link';
        row.querySelector('button').addEventListener('click', () => deleteRole(role.id));
        list.appendChild(row);
      });
    }

    function renderPanels(){
      const list = document.getElementById('panelsList');
      if(!settings.panels.length){
        list.innerHTML = '<div class="meta">No panels yet.</div>';
        return;
      }
      list.innerHTML = '';
      settings.panels.forEach(panel => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div>
            <div class="title"></div>
            <div class="meta"></div>
          </div>
          <button class="btn danger" data-id="${panel.id}">Delete</button>
        `;
        row.querySelector('.title').textContent = panel.name;
        row.querySelector('.meta').textContent = panel.email;
        row.querySelector('button').addEventListener('click', () => deletePanel(panel.id));
        list.appendChild(row);
      });
    }

    async function addRole(){
      const payload = {
        name: document.getElementById('roleName').value.trim(),
        upload_link: document.getElementById('roleLink').value.trim(),
        email_subject: document.getElementById('emailSubject').value.trim(),
        email_body: document.getElementById('emailBody').value.trim(),
        invite_subject: document.getElementById('inviteSubject').value.trim(),
        invite_body: document.getElementById('inviteBody').value.trim()
      };
      const res = await fetch('/api/roles', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await res.json();
      if(!res.ok){ setStatus('roleStatus', data.error || 'Could not add role', 'err'); return; }
      ['roleName','roleLink','emailSubject','emailBody','inviteSubject','inviteBody'].forEach(id => document.getElementById(id).value = '');
      setStatus('roleStatus', 'Role added', 'ok');
      await loadSettings();
    }

    async function deleteRole(id){
      if(!confirm('Delete this role?')) return;
      const res = await fetch('/api/roles/' + encodeURIComponent(id), {method:'DELETE'});
      const data = await res.json();
      if(!res.ok){ setStatus('roleStatus', data.error || 'Could not delete role', 'err'); return; }
      setStatus('roleStatus', 'Role deleted', 'ok');
      await loadSettings();
    }

    async function addPanel(){
      const payload = {
        name: document.getElementById('panelName').value.trim(),
        email: document.getElementById('panelEmail').value.trim()
      };
      const res = await fetch('/api/panels', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await res.json();
      if(!res.ok){ setStatus('panelStatus', data.error || 'Could not add panel', 'err'); return; }
      document.getElementById('panelName').value = '';
      document.getElementById('panelEmail').value = '';
      setStatus('panelStatus', 'Panel added', 'ok');
      await loadSettings();
    }

    async function deletePanel(id){
      if(!confirm('Delete this panel?')) return;
      const res = await fetch('/api/panels/' + encodeURIComponent(id), {method:'DELETE'});
      const data = await res.json();
      if(!res.ok){ setStatus('panelStatus', data.error || 'Could not delete panel', 'err'); return; }
      setStatus('panelStatus', 'Panel deleted', 'ok');
      await loadSettings();
    }

    document.getElementById('addRoleBtn').addEventListener('click', addRole);
    document.getElementById('addPanelBtn').addEventListener('click', addPanel);
    loadSettings();
  </script>
</body>
</html>
